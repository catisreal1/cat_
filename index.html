<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my tool online/ᐠ - ˕ -マ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #181818;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 350px;
            border: 1px solid #272727;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: #2ea043;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }
        .btn:hover {
            background: #238636;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46, 160, 67, 0.4);
        }
        .btn.script {
            background: #1f6feb;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
        }
        .btn.script:hover {
            background: #1158c7;
            box-shadow: 0 6px 16px rgba(31, 111, 235, 0.4);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>tool</h1>
        <a href="Velocity.7z" class="btn" download>Velocity.7z</a>
        <a href="script.txt" class="btn script" download>Script (Notepad)</a>
        <div style="text-align: center; margin-top: 15px;">
            <audio controls loop style="width: 100%; max-width: 300px; height: 32px;">
                <source src="music_Slowed.mp3" type="audio/mp3">
            </audio>
        </div>
        
        <div class="footer">my exc and script</div>
    </div>

</body>
</html>
